name: civic_reporting
description: AI-Enhanced Civic Reporting System - Flutter Web & Mobile
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  image_picker: ^1.0.7
  http: ^1.2.0
  file_picker: ^8.0.0
  geolocator: ^14.0.2
  flutter_image_compress: ^2.1.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/hotspots.png
